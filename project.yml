name: Zone
options:
  bundleIdPrefix: com.nethum
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: NYKPX446L9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
targets:
  Zone:
    type: application
    platform: iOS
    sources: [Zone, Shared, WidgetShared, ZoneShield/ShieldLook.swift, ZoneShield/Shield.xcassets]
    dependencies:
      - target: ZoneMonitor
      - target: ZoneShield
      - target: ZoneShieldAction
      - target: ZoneWidget
    scheme:
      testTargets: [ZoneTests]
    # The launch screen is the Zone background, so the launch animation starts on the same colour.
    info:
      path: Zone/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
    entitlements:
      path: Zone/Zone.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.nfc.readersession.formats: [TAG]
        com.apple.security.application-groups: [group.com.nethum.zone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nethum.zone
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Zone
        INFOPLIST_KEY_NFCReaderUsageDescription: Zone reads your tag to start and end a session.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "3"
  ZoneMonitor:
    type: app-extension
    platform: iOS
    sources: [ZoneMonitor, Shared]
    entitlements:
      path: ZoneMonitor/ZoneMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.nethum.zone]
    info:
      path: ZoneMonitor/Info.plist
      properties:
        CFBundleDisplayName: Zone Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ZoneMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nethum.zone.monitor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "3"
  ZoneShield:
    type: app-extension
    platform: iOS
    sources: [ZoneShield, Shared]
    entitlements:
      path: ZoneShield/ZoneShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.nethum.zone]
    info:
      path: ZoneShield/Info.plist
      properties:
        CFBundleDisplayName: Zone Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nethum.zone.shield
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "3"
  ZoneShieldAction:
    type: app-extension
    platform: iOS
    sources: [ZoneShieldAction]
    entitlements:
      path: ZoneShieldAction/ZoneShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.nethum.zone]
    info:
      path: ZoneShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Zone Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nethum.zone.shieldaction
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "3"
  ZoneWidget:
    type: app-extension
    platform: iOS
    sources:
      - ZoneWidget
      - WidgetShared
      - Zone/Theme.swift
      - Zone/ZoneStats.swift
      - Shared/ZoneSession.swift
    entitlements:
      path: ZoneWidget/ZoneWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.nethum.zone]
    info:
      path: ZoneWidget/Info.plist
      properties:
        CFBundleDisplayName: Zone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nethum.zone.widget
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "3"
  ZoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZoneTests]
    dependencies:
      - target: Zone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
