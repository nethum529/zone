name: Zone
options:
  bundleIdPrefix: com.nethum
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: NYKPX446L9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
targets:
  Zone:
    type: application
    platform: iOS
    sources: [Zone, Shared]
    dependencies:
      - target: ZoneMonitor
    scheme:
      testTargets: [ZoneTests]
    entitlements:
      path: Zone/Zone.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.developer.nfc.readersession.formats: [TAG]
        com.apple.security.application-groups: [group.com.nethum.zone]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nethum.zone
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Zone
        INFOPLIST_KEY_NFCReaderUsageDescription: Zone reads your tag to start and end a session.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "2"
  ZoneMonitor:
    type: app-extension
    platform: iOS
    sources: [ZoneMonitor, Shared]
    entitlements:
      path: ZoneMonitor/ZoneMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.nethum.zone]
    info:
      path: ZoneMonitor/Info.plist
      properties:
        CFBundleDisplayName: Zone Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ZoneMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nethum.zone.monitor
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "2"
  ZoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZoneTests]
    dependencies:
      - target: Zone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
